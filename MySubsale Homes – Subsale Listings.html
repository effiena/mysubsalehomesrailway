<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>MySubsale Homes – Subsale Listings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#0e1b2c;--mu:#5f6b7a;--bd:#e0e5ec;--ac:#0b3b6f;--gold:#b98a2e;--gb:#fbf3e1;--ok:#0f7a4d;--okb:#e3f5ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#111e33;--tx:#eef2f7;--mu:#9aa8bb;--bd:#22324c;--ac:#6aa8ff;--gold:#e0b45a;--gb:#2b2410;--ok:#4fd39a;--okb:#0f2d22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#111e33;--tx:#eef2f7;--mu:#9aa8bb;--bd:#22324c;--ac:#6aa8ff;--gold:#e0b45a;--gb:#2b2410;--ok:#4fd39a;--okb:#0f2d22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0b2a4f;color:#fff;padding:26px 20px 22px}
header .in,main{max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:24px}header p{margin:4px 0 14px;color:#c9d6e8}
.btn{display:inline-block;padding:9px 16px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;margin-right:8px;border:1px solid transparent}
.b1{background:#25d366;color:#06280f}.b2{background:transparent;border-color:#c9d6e8;color:#fff}
main{padding:18px 20px 40px}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;width:100%}
.count{color:var(--mu);font-size:13px;margin:6px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.price{font-size:24px;font-weight:700;color:var(--ac)}
.mv{font-size:13px;color:var(--mu)}
.disc{display:inline-block;background:var(--okb);color:var(--ok);font-weight:600;font-size:12px;padding:2px 9px;border-radius:99px;margin-left:6px}
.card h3{margin:0;font-size:16px}.loc{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px}
.chip.t{background:var(--gb);border-color:var(--gold);color:var(--gold);font-weight:600}
.card .btn{margin:6px 0 0;background:var(--ac);color:#fff;text-align:center}
.empty{text-align:center;color:var(--mu);padding:40px 0}
footer{max-width:1100px;margin:0 auto;padding:0 20px 30px;color:var(--mu);font-size:12px}
</style></head><body>
<header><div class="in"><h1>MySubsale Homes</h1><p>Subsale homes all around Johor</p>
<a class="btn b1" id="wa" href="#">WhatsApp us</a><a class="btn b2" href="https://t.me/mysubsalehomes">Telegram channel</a></div></header>
<main>
<div class="filters">
<select id="fc"></select><select id="ft"></select><select id="fb"></select>
<select id="fp"><option value="0">Any price</option><option value="300000">Up to RM300,000</option><option value="400000">Up to RM400,000</option><option value="500000">Up to RM500,000</option><option value="600000">Up to RM600,000</option><option value="700000">Up to RM700,000</option></select>
<select id="fs"><option value="pl">Price: low to high</option><option value="ph">Price: high to low</option><option value="d">Biggest discount</option></select>
</div>
<div class="count" id="cnt"></div><div class="grid" id="g"></div>
</main>
<footer>Prices are asking prices (SP). MV is market value. Details and availability can change, please confirm before viewing. Title: Bumi, Non Bumi or International buyer category.</footer>
<script>
const PH="60109688408";
const R=[["Johor","Jalan Api-Api, Taman Megah Ria","Masai","Semi-D","Freehold","3B2T","Non Bumi","2660","580,000","640,000"],
["Johor","Jalan Selayang xx, Taman Pasir Putih","Pasir Gudang","Single Storey","Freehold","3B2T","International","1302","380,000","450,000"],
["Johor","Jalan Anggerik 4/2 Taman Anggerik JB","Masai","Semi-D","Freehold","3B2T","Non Bumi","2660","498,000","550,000"],
["Johor","Jalan Jati x, Bandar Putra","Kulai","Double Storey","Freehold","2B2T","Bumi","2626","440,000","520,000"],
["Johor","Tasek Maya, Maya Height, Seri Alam","Plentong","Double Storey","Freehold","4B3T","Non Bumi","n.a","645,000","730,000"],
["Johor","6x, Jalan Asli 10, Taman Pasir Putih","Pasir Gudang","Double Storey","Freehold","2B2T","Bumi","n.a","300,000","330,000"],
["Johor","Jalan Pertanian 43, Taman Universiti","Skudai","Single Storey","Freehold","3B2T","Bumi","1044","429,000","450,000"],
["Johor","Pangsapuri Pulai Mutiara 1 (RMMJ), Kangkar Pulai","Pulai","Apartment","Freehold","3B2T","Bumi","1000","288,000","320,000"],
["Johor","Jalan P1 x/9, Taman Pulai Indah","Skudai","Single Storey","Freehold","3B3T","Bumi","1500","508,000","530,000"],
["Johor","Jalan Pertanian 44, Taman Universiti","Skudai","Single Storey","Freehold","4B3T","Non Bumi","2809","680,000","740,000"],
["Johor","Jalan Putra 12, Taman Tan Sri Yaacob","Skudai","Double Storey","Freehold","3B2T","Non Bumi","770","480,000","550,000"],
["Johor","Jalan Kemuliaan 20, Taman Universiti","Skudai","Single Storey","Freehold","3B2T","Non Bumi","1302","450,000","510,000"]];
const num=s=>parseInt(String(s).replace(/[^\d]/g,""),10)||0;
const L=R.map(r=>{const m=/(\d+)B(\d+)T/i.exec(r[5]);return{st:r[0],loc:r[1].trim(),city:r[2],type:r[3],geran:r[4],rooms:r[5],bed:m?m[1]:"",bath:m?m[2]:"",title:r[6],size:num(r[7]),sp:num(r[8]),mv:num(r[9])}});
L.forEach(x=>x.disc=x.mv>x.sp?Math.round((x.mv-x.sp)/x.mv*100):0);
const rm=n=>"RM"+n.toLocaleString("en-US");
const $=id=>document.getElementById(id);
function opts(id,label,key){const v=[...new Set(L.map(x=>x[key]))].sort();$(id).innerHTML='<option value="">'+label+'</option>'+v.map(a=>'<option>'+a+'</option>').join("")}
opts("fc","All areas","city");opts("ft","All property types","type");opts("fb","All buyer titles","title");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draw(){
 let a=L.filter(x=>(!$("fc").value||x.city==$("fc").value)&&(!$("ft").value||x.type==$("ft").value)&&(!$("fb").value||x.title==$("fb").value)&&(!+$("fp").value||x.sp<=+$("fp").value));
 const s=$("fs").value;a.sort((p,q)=>s=="ph"?q.sp-p.sp:s=="d"?q.disc-p.disc:p.sp-q.sp);
 $("cnt").textContent=a.length+" listing"+(a.length==1?"":"s");
 $("g").innerHTML=a.map(x=>{
  const msg="Hi, I’m interested in the "+x.type+" at "+x.loc+", "+x.city+" ("+rm(x.sp)+"). Is it still available?";
  return '<div class="card"><div class="price">'+rm(x.sp)+(x.disc?'<span class="disc">'+x.disc+'% below MV</span>':'')+'</div>'
  +'<div class="mv">Market value '+rm(x.mv)+'</div>'
  +'<h3>'+esc(x.type)+' in '+esc(x.city)+'</h3><div class="loc">'+esc(x.loc)+', '+esc(x.st)+'</div>'
  +'<div class="chips">'+(x.bed?'<span class="chip">'+x.bed+' bed · '+x.bath+' bath</span>':'')
  +'<span class="chip">'+(x.size?x.size.toLocaleString("en-US")+' sqft':'Size on request')+'</span>'
  +'<span class="chip">'+esc(x.geran)+'</span><span class="chip t">'+esc(x.title)+'</span></div>'
  +'<a class="btn" href="https://wa.me/'+PH+'?text='+encodeURIComponent(msg)+'">Enquire on WhatsApp</a></div>'}).join("")||'<div class="empty">No listings match. Try another filter.</div>';
}
document.querySelectorAll("select").forEach(e=>e.onchange=draw);
$("wa").href="https://wa.me/"+PH+"?text="+encodeURIComponent("Hi, I’d like to know more about your subsale homes.");
draw();
</script></body></html>
